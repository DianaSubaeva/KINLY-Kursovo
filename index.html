<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINLY - Трекер домашних животных</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="kinly2/css/style.css">
</head>
<body>
    <!-- Декоративные элементы -->
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>

    <!-- Уведомления -->
    <div id="notification-container" class="notification-container"></div>

    <!-- Главный контейнер -->
    <div class="container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="logo-section">
                <div class="logo">
                    <i class="fas fa-paw"></i>
                </div>
                <h1>KINLY</h1>
            </div>

            <nav class="main-nav">
                <div class="nav-section">
                    <h3>Мои питомцы</h3>
                    <div class="pets-list" id="pets-list">
                        <!-- Pets will be loaded here dynamically -->
                    </div>
                    <div class="add-pet-btn" id="add-pet-btn">
                        <span class="btn-icon"><i class="fas fa-plus"></i></span>
                        Добавить питомца
                    </div>
                </div>

                <div class="nav-section">
                    <h3>Навигация</h3>
                    <div class="nav-links">
                        <a href="#" class="nav-link active" data-page="overview">
                            <span class="nav-icon"><i class="fas fa-chart-bar"></i></span>
                            <span>Обзор</span>
                        </a>
                        <a href="#" class="nav-link" data-page="health">
                            <span class="nav-icon"><i class="fas fa-heartbeat"></i></span>
                            <span>Здоровье</span>
                        </a>
                        <a href="#" class="nav-link" data-page="care">
                            <span class="nav-icon"><i class="fas fa-shield-alt"></i></span>
                            <span>Уход</span>
                        </a>
                        <a href="#" class="nav-link" data-page="nutrition">
                            <span class="nav-icon"><i class="fas fa-utensils"></i></span>
                            <span>Питание</span>
                        </a>
                        <a href="#" class="nav-link" data-page="gallery">
                            <span class="nav-icon"><i class="fas fa-images"></i></span>
                            <span>Галерея</span>
                        </a>
                        <a href="#" class="nav-link" data-page="reminders">
                            <span class="nav-icon"><i class="fas fa-bell"></i></span>
                            <span>Напоминания</span>
                        </a>
                    </div>
                </div>
            </nav>

            <div class="user-section" id="user-profile">
                <div class="user-avatar" id="user-avatar">Д</div>
                <div class="user-info">
                    <strong id="user-name">Субаева Диана</strong>
                    <span id="user-role">Владелец питомцев</span>
                </div>
                <button class="user-edit-btn" style="
                    background: transparent;
                    border: none;
                    color: var(--text-tertiary);
                    cursor: pointer;
                    font-size: 14px;
                    margin-left: auto;
                    padding: 4px 8px;
                ">
                    <i class="fas fa-edit"></i>
                </button>
            </div>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Верхняя панель -->
            <header class="top-bar">
                <div class="breadcrumb" id="breadcrumb">
                    <a href="#">Главная</a>
                    <span class="breadcrumb-divider">/</span>
                    <span class="current">Обзор</span>
                </div>
                <div class="header-actions">
                    <div class="date-display" id="current-date">
                        <span class="date-icon"><i class="far fa-calendar"></i></span>
                        <!-- Date will be set dynamically -->
                    </div>
                    <div class="notification" id="notification-bell">
                        <span class="notification-icon"><i class="far fa-bell"></i></span>
                        <span class="notification-badge">2</span>
                    </div>
                </div>
            </header>

            <!-- Контент страницы -->
            <div class="page-content" id="page-content">
                <!-- Content will be loaded here dynamically -->
            </div>
        </main>
    </div>

    <!-- Модальное окно -->
    <div id="modal-container"></div>

    <!-- Подключение скриптов -->
    <!-- Константы -->
    <script src="kinly2/js/constants/const.js"></script>
    
    <!-- Mock данные -->
    <script src="kinly2/js/data/mock/pets.js"></script>
    <script src="kinly2/js/data/mock/events.js"></script>
    <script src="kinly2/js/data/mock/meals.js"></script>
    <script src="kinly2/js/data/mock/reminders.js"></script>
    <script src="kinly2/js/data/mock/careItems.js"></script>
    <script src="kinly2/js/data/mock/photos.js"></script>
    <script src="kinly2/js/data/mock/health.js"></script> 
    
    <!-- Data Manager -->
    <script src="kinly2/js/data/DataManager.js"></script>
    
    <!-- Компоненты -->
    <script src="kinly2/js/components/modals/BaseModal.js"></script>
    <script src="kinly2/js/components/modals/PetModal.js"></script>
    <script src="kinly2/js/components/forms/ProfileForm.js"></script>
    
    <!-- Менеджеры -->
    <script src="kinly2/js/managers/ModalManager.js"></script>
    <script src="kinly2/js/managers/NotificationManager.js"></script>
    <script src="kinly2/js/managers/PetManager.js"></script>
    <script src="kinly2/js/managers/ProfileManager.js"></script>
    
    <!-- Презентеры -->
    <script src="kinly2/js/presenters/Presenter.js"></script>
    <script src="kinly2/js/presenters/OverviewPresenter.js"></script>
    <script src="kinly2/js/presenters/HealthPresenter.js"></script>
    <script src="kinly2/js/presenters/CarePresenter.js"></script>
    <script src="kinly2/js/presenters/NutritionPresenter.js"></script>
    <script src="kinly2/js/presenters/GalleryPresenter.js"></script>
    <script src="kinly2/js/presenters/RemindersPresenter.js"></script>
    
    
    <!-- Главное приложение -->
    <script src="kinly2/js/app.js"></script>
</body>
</html>
