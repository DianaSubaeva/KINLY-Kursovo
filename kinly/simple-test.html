<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Простой тест</title>
    <style>
        .sidebar {
            width: 300px;
            background: #f5f5f5;
            height: 100vh;
            padding: 20px;
        }
        .add-pet-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Мои питомцы</h2>
        <button class="add-pet-btn" onclick="openModal()">+ Добавить питомца</button>
    </div>

    <script>
        function openModal() {
            console.log('🎯 Кнопка нажата!');
            
            const modal = document.createElement('div');
            modal.innerHTML = `
                <div class="modal-overlay">
                    <div class="modal-content">
                        <h3>Добавить питомца</h3>
                        <form onsubmit="handleSubmit(event)">
                            <input type="text" placeholder="Имя питомца" required style="width:100%;padding:8px;margin:10px 0;">
                            <div style="display:flex;gap:10px;margin-top:20px;">
                                <button type="button" onclick="closeModal()" style="padding:10px 20px;background:#6b7280;color:white;border:none;border-radius:6px;flex:1;">Отмена</button>
                                <button type="submit" style="padding:10px 20px;background:#3b82f6;color:white;border:none;border-radius:6px;flex:1;">Добавить</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
        }

        function closeModal() {
            document.querySelector('.modal-overlay')?.remove();
        }

        function handleSubmit(event) {
            event.preventDefault();
            const input = event.target.querySelector('input');
            console.log('📝 Добавляем питомца:', input.value);
            closeModal();
        }

        // ESC закрытие
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
